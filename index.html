<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Inventory demo</title></head>
<body>
  <h1>Inventory</h1>
  <button id="add">Add mug</button>
  <p>Items in stock: <span id="count">0</span></p>
  <script>
    let n = 0;
    document.getElementById('add').addEventListener('click', () => {
      n += 1;
      document.getElementById('count').textContent = n;
      console.log('added mug, count is now', n);
    });
  </script>
</body>
</html>
